<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon compte TSŪ</title><link rel="stylesheet" href="/admin/style.css"><script defer src="/compte/index.js"></script></head>
<body><header><a href="/">TSŪ <span>Boutique</span></a><strong>Mon compte</strong></header>
<main><h1>Mon compte TSŪ</h1><p id="notice" role="status"></p>
<section id="guest" hidden><div class="heading"><button type="button" data-mode="register">Créer un compte</button><button type="button" data-mode="login">Se connecter</button></div>
<form id="auth"><h2 id="form-title"></h2><p id="explanation"></p><div class="fields">
<label>Adresse e-mail <input type="email" name="email" autocomplete="username" readonly></label>
<div><label for="account-password">Mot de passe</label><div class="password-field"><input id="account-password" type="password" name="password" maxlength="128" required><button id="show-password" type="button" aria-label="Afficher le mot de passe" aria-controls="account-password" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle><path id="password-slash" d="m3 3 18 18" hidden></path></svg></button></div></div></div>
<p id="password-hint">Choisis un mot de passe unique de 15 caractères ou plus.</p><button type="submit" id="submit"></button>
</form></section>
<section id="signed-in" hidden><h2>Espace propriétaire</h2><p id="email"></p><div class="heading"><a id="admin-link" href="/admin">Ouvrir l’administration</a><button type="button" id="logout">Se déconnecter</button></div></section>
</main></body></html>
