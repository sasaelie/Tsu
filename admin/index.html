<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration TSŪ</title><link rel="stylesheet" href="/admin/style.css"><script defer src="/admin/index.js"></script></head>
<body><header><a href="/">TSŪ <span>Boutique</span></a><strong>Administration</strong></header>
<main><h1>Gérer TSŪ</h1><p id="identity"></p><p id="notice" role="status" aria-live="polite"></p>
<nav aria-label="Administration"><button data-tab="products">Produits</button><button data-tab="settings">Boutique</button><button data-tab="orders">Commandes et tests</button></nav>
<section id="products"><div class="heading"><h2>Produits</h2><button type="button" id="new">Nouveau produit</button></div><div id="product-list"></div>
<form id="product-form" hidden><h3>Fiche produit</h3><input name="id" type="hidden"><div class="fields">
<label>Nom <input name="name" required maxlength="100"></label><label>Catégorie <select name="type"><option value="tee">T-shirt</option><option value="acc">Accessoire</option></select></label>
<label>Prix en euros <input name="price" type="number" min="0.50" max="9999" step="0.01" required></label><label>URL HTTPS de la photo <input name="image" type="url" maxlength="2048"></label>
<label>Description française <textarea name="fr" maxlength="1500"></textarea></label><label>Description anglaise <textarea name="en" maxlength="1500"></textarea></label></div>
<fieldset><legend>Variantes Printful</legend><div id="variants"></div><button type="button" id="add-variant">Ajouter une variante</button></fieldset>
<div class="checks"><label><input type="checkbox" name="published"> Publier dans la boutique</label><label><input type="checkbox" name="featured"> Mettre en avant</label></div>
<button type="submit">Enregistrer le produit</button></form></section>
<section id="settings" hidden><h2>Boutique</h2><form id="settings-form">
<div class="fields"><label>Titre français <input name="tagFr" maxlength="120"></label><label>Titre anglais <input name="tagEn" maxlength="120"></label>
<label>Texte français <textarea name="pitchFr" maxlength="300"></textarea></label><label>Texte anglais <textarea name="pitchEn" maxlength="300"></textarea></label></div>
<fieldset><legend>Pays de livraison</legend><div class="checks"><label><input type="checkbox" name="be"> Belgique</label><label><input type="checkbox" name="fr"> France</label></div></fieldset>
<button>Enregistrer la boutique</button></form></section>
<section id="orders" hidden><h2>Commandes et tests</h2><p id="connections"></p><div class="heading"><button id="refresh-orders">Actualiser les commandes</button><a href="/#collection">Ouvrir le catalogue</a></div><div id="order-list"></div></section>
</main></body></html>
